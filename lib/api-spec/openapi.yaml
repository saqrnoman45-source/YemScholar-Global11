openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NexPath Educational Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: courses
    description: Course operations
  - name: enrollments
    description: Enrollment operations
  - name: scholarships
    description: Scholarship operations
  - name: articles
    description: Research article operations
  - name: skills
    description: Skills tracking operations
  - name: admin
    description: Admin dashboard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Not found
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /courses/{id}/enroll:
    post:
      operationId: enrollInCourse
      tags: [enrollments]
      summary: Enroll the current user in a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /enrollments:
    get:
      operationId: listMyEnrollments
      tags: [enrollments]
      summary: List courses the current user is enrolled in
      responses:
        "200":
          description: Enrolled courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"

  /enrollments/{id}/progress:
    patch:
      operationId: updateEnrollmentProgress
      tags: [enrollments]
      summary: Update progress for an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /scholarships:
    get:
      operationId: listScholarships
      tags: [scholarships]
      summary: List all scholarships
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of scholarships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scholarship"
    post:
      operationId: createScholarship
      tags: [scholarships]
      summary: Create a scholarship (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScholarshipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scholarship"

  /scholarships/{id}:
    get:
      operationId: getScholarship
      tags: [scholarships]
      summary: Get a scholarship by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scholarship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scholarship"
        "404":
          description: Not found
    patch:
      operationId: updateScholarship
      tags: [scholarships]
      summary: Update a scholarship (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScholarshipUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scholarship"
    delete:
      operationId: deleteScholarship
      tags: [scholarships]
      summary: Delete a scholarship (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scholarships/{id}/apply:
    post:
      operationId: applyForScholarship
      tags: [scholarships]
      summary: Apply for a scholarship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScholarshipApplicationInput"
      responses:
        "201":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipApplication"

  /applications:
    get:
      operationId: listMyApplications
      tags: [scholarships]
      summary: List the current user's scholarship applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScholarshipApplication"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List all research articles
      parameters:
        - name: topic
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create a research article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get an article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
    patch:
      operationId: updateArticle
      tags: [articles]
      summary: Update an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List all available skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /users/me/skills:
    get:
      operationId: getMySkills
      tags: [skills]
      summary: Get the current user's skills
      responses:
        "200":
          description: User skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSkill"
    post:
      operationId: addMySkill
      tags: [skills]
      summary: Add a skill to the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSkillInput"
      responses:
        "201":
          description: Skill added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkill"

  /users/me/skills/{skillId}:
    delete:
      operationId: removeMySkill
      tags: [skills]
      summary: Remove a skill from the current user
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide statistics (admin)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user's role or status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      summary: List all scholarship applications (admin)
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScholarshipApplication"

  /admin/applications/{id}:
    patch:
      operationId: updateApplicationStatus
      tags: [admin]
      summary: Update scholarship application status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipApplication"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, teacher, admin]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, email, name, role, createdAt]

    RegisterInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
      required: [email, password, name]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: integer
        thumbnailUrl:
          type: ["string", "null"]
        instructorName:
          type: string
        enrollmentCount:
          type: integer
        rating:
          type: ["number", "null"]
        createdAt:
          type: string
      required: [id, title, description, category, level, duration, instructorName, enrollmentCount, createdAt]

    CourseInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: integer
        thumbnailUrl:
          type: string
        instructorName:
          type: string
      required: [title, description, category, level, duration, instructorName]

    CourseUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: integer
        thumbnailUrl:
          type: string
        instructorName:
          type: string

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        courseId:
          type: integer
        progress:
          type: integer
        status:
          type: string
          enum: [active, completed, dropped]
        enrolledAt:
          type: string
        completedAt:
          type: ["string", "null"]
        course:
          $ref: "#/components/schemas/Course"
      required: [id, userId, courseId, progress, status, enrolledAt]

    ProgressUpdate:
      type: object
      properties:
        progress:
          type: integer
      required: [progress]

    Scholarship:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        provider:
          type: string
        amount:
          type: ["number", "null"]
        category:
          type: string
        deadline:
          type: ["string", "null"]
        eligibility:
          type: string
        applicationCount:
          type: integer
        createdAt:
          type: string
      required: [id, title, description, provider, category, eligibility, applicationCount, createdAt]

    ScholarshipInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        provider:
          type: string
        amount:
          type: number
        category:
          type: string
        deadline:
          type: string
        eligibility:
          type: string
      required: [title, description, provider, category, eligibility]

    ScholarshipUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        provider:
          type: string
        amount:
          type: number
        category:
          type: string
        deadline:
          type: string
        eligibility:
          type: string

    ScholarshipApplication:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        scholarshipId:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected]
        statement:
          type: ["string", "null"]
        appliedAt:
          type: string
        scholarship:
          $ref: "#/components/schemas/Scholarship"
      required: [id, userId, scholarshipId, status, appliedAt]

    ScholarshipApplicationInput:
      type: object
      properties:
        statement:
          type: string
      required: [statement]

    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        topic:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        readTime:
          type: integer
        publishedAt:
          type: string
      required: [id, title, summary, content, topic, authorId, authorName, readTime, publishedAt]

    ArticleInput:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        topic:
          type: string
        thumbnailUrl:
          type: string
        readTime:
          type: integer
      required: [title, summary, content, topic, readTime]

    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        topic:
          type: string
        thumbnailUrl:
          type: string
        readTime:
          type: integer

    Skill:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
      required: [id, name, category]

    UserSkill:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        skillId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced, expert]
        addedAt:
          type: string
        skill:
          $ref: "#/components/schemas/Skill"
      required: [id, userId, skillId, level, addedAt]

    UserSkillInput:
      type: object
      properties:
        skillId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced, expert]
      required: [skillId, level]

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalCourses:
          type: integer
        totalEnrollments:
          type: integer
        totalScholarships:
          type: integer
        totalApplications:
          type: integer
        totalArticles:
          type: integer
        recentSignups:
          type: integer
        completionRate:
          type: number
      required: [totalUsers, totalCourses, totalEnrollments, totalScholarships, totalApplications, totalArticles, recentSignups, completionRate]

    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [student, teacher, admin]
        name:
          type: string

    ApplicationStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
      required: [status]
